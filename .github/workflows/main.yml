name: Lint Codebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Run Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Setup Environment (Example: Node.js) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # --- Install Project Dependencies ---
      - name: Install Dependencies
        run: npm ci

      # --- Execute Linter ---
      - name: Run Linter
        run: npm run lint